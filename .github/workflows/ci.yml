name: Verify SnakeLab
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser-project: [chromium-desktop, chromium-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=${{ matrix.browser-project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report-${{ matrix.browser-project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
